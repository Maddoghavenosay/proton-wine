name: Build Proton Wine (11.0-2)

on:
  push:
    branches: [ main, master, proton_11.0, proton_11.0-2 , 'aio-eanet/**' ]
  pull_request:
    branches: [ main, master, proton_11.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Wayland desktop build: only the arm64ec layer carries winewayland.
        arch: [aarch64]
        api_level: [28]
      fail-fast: false
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libwayland-bin \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386
      
      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/
      
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d
      
      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724
      
      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920
      
      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
      
      - name: Autogen
        run: |
          bash build-scripts/build-step0-autogen.sh
      
      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      # ccache — caches compiled objects across runs. Exact key (per-commit) = full warm restore on a
      # re-run of the same commit; restore-keys pull the newest prior cache so an unchanged-source rebuild
      # is near-instant. ccache self-validates staleness, so a rolling restore is safe.
      - name: Cache ccache (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-${{ matrix.arch }}-${{ matrix.api_level }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-${{ matrix.arch }}-${{ matrix.api_level }}-

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh
      
      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build-sysvshm
          else
            bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          fi
      
      - name: Configure build for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --configure
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --configure
          fi
      
      - name: Build Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --build
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --build
          fi

      - name: ccache stats (${{ matrix.arch }})
        if: always()
        run: ccache -s || true

      - name: Install Proton for ${{ matrix.arch }} (sdk${{ matrix.api_level }})
        run: |
          PAGES_FLAG=""
          { [ "${{ matrix.arch }}" = "aarch64" ] || [ "${{ matrix.api_level }}" = "35" ]; } && PAGES_FLAG="--enable-16kb-pages"
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh $PAGES_FLAG --install
          else
            bash build-scripts/build-step-arm64ec.sh $PAGES_FLAG --install
          fi
      
      - name: Download prefixPack.txz for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-x86_64-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          else
            wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz
          fi
      
      - name: Generate profile.json files
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          
          # Generate Proton profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "11.0-2.1-${ARCH_NAME}",
            "versionCode": 16,
            "description": "EXPERIMENTAL Wayland layer — Proton 11.0-2 ${ARCH_NAME} (bionic) with winewayland.drv + its own Wayland Turnips (Mesa 26.3) for Bannerlator's embedded Wayland compositor; also runs as a normal X11 Proton. 8 Wayland Turnip drivers + app-selectable game driver: plain = upstream 7cda7850 (Adreno 6xx/730/740/750), a7xx = Vauzi-17 710/720/722 v3.6 recipe, a8xx = WN-Turnip 1.15 Balanced, a8xx-perf = WN-Turnip 1.15 Performance (PWR_MAX), a8xx-gen8 = Banners-Turnip A8xx gen8 recipe (whitebelyash tu8 series + 64K shared mem), a8xx-smxz = StevenMXZ Turnip Gen8 V36 recipe (upstream c501e1d1), a8xx-white = whitebelyash Mainline Turnip v31 (mesa-unified turnip/gen8 9c475fc3), a8xx-upstream = Mesa main @ bbc7792f (2026-09-13). Native OpenGL now renders on Wayland: the bundled Mesa takes EGL's Wayland DRM path (dma-buf feedback -> render node -> zink + kopper) instead of its software one, so Wine's opengl32/ddraw titles draw on the GPU through the same Turnip and the same WSI as everything else, zero-copy included, rather than coming out black. All eight follow the compositor's LIVE zero-copy switch (banner_ahb_v1 version 2 mode event): the in-game Zero-copy presentation toggle now rebuilds the game's swapchain on, or off, Android display buffers without a relaunch; on an app whose compositor only advertises version 1 they behave exactly as versionCode 5 did (zero-copy iff BANNER_WSI_AHB=1). Keyboard layout names via bundled xkeyboard-config; desktop-close grace restored to 1 s. XP Start menu Control Panel opens Wine's Control Panel (control.exe, with its icon; Add/Remove Programs, Game Controllers, Internet Settings) and explorer opens ::{CLSID} shell folders again. OpenGL also renders on phones that give apps no DRM render node (main device 0:0, e.g. Adreno 830/840 retail devices): EGL runs zink + kopper on the Vulkan device without one instead of falling to a software path that drew a black window. HDR10 screens are described to Windows: given the app's BANNER_WAYLAND_HDR_MAX_NITS / _MAX_AVG_NITS / _MIN_NITS, the Wayland monitor and the Windows virtual desktop's monitor (the one DXGI reads) carry an EDID with CTA-861.3 HDR static metadata (SMPTE ST 2084, BT.2020), so DXGI reports the screen's real peak, frame-average and black level instead of DXVK's 1499/799/0.01-nit stand-ins. With HDR switched on for the session (DXVK_HDR=1) that monitor, the physical one and the virtual desktop's, now also reports Windows advanced colour, so a game that asks DisplayConfig whether its display is in HDR (QueryDisplayConfig + DISPLAYCONFIG_DEVICE_INFO_GET_ADVANCED_COLOR_INFO: advancedColorSupported/Enabled, 10 bits per channel) stops greying out its own HDR option; only a screen whose EDID really describes HDR10 can claim it, so an SDR screen never does and X11 sessions, which give no EDID, are unchanged. Games that ask AMD's AGS library instead now get the same answer: the layer ships Wine's own amd_ags_x64.dll for the first time (the arm64ec build had it disabled), so a title that links AGS - RE Engine games do, and decide their HDR option there - stops falling back to the copy beside its .exe, which talks to an AMD driver that is not here and reports no display at all. Wine's AGS reads the screen from DXGI, so with the session in HDR it reports HDR10 whatever the GPU is. DisplayConfig also answers GET_SDR_WHITE_LEVEL (80-nit reference white) and SET_ADVANCED_COLOR_STATE instead of failing them, so an app that asks those next to the HDR question is not told the whole query failed. What AGS decided is written into the prefix registry, under HKEY_CURRENT_USER > Software > Wine > AmdAgs, so an HDR problem can be read out of the registry on a device with no Wine log, and every step of it is marked there now - DLL attach, which entry point the game called, what Vulkan answered, how many displays were found and the colour space of each - so a greyed-out HDR option can be traced without a Wine log at all. On arm64ec the builtin AGS now also wins over the amd_ags_x64.dll a game ships next to its .exe, which is what x86_64 Proton already does: the lookup used to go to an x86_64-windows folder this build does not have, so no builtin could ever replace such a file and the shipped copy - which talks to an AMD driver that is not here and reports no display at all - always won. Only that one module is redirected; the default load order is unchanged for everything else, and a container can set the amd_ags_x64 DLL override to native to get the old behaviour back. Zero-copy game buffers are UBWC-compressed where gralloc and the compositor can take them (the eight Turnips ask gralloc for UBWC with its vendor usage bit 28 and keep it only when the buffer's handle proves it; linear as before otherwise, e.g. on grallocs whose handle they can't read), and the Wayland log names UBWC or linear once per swapchain. Own layer line 11.0-2.1 (never offered as an update to stock 11.0-2). Base: — stock Valve + fast-yield gate + FEX-unixlib loader + DirectAudio v1.3.2 (opt-in: registry Audio=directaudio; pulse/alsa stay default) + Android fixes (noexec/force_anon SD-card boot, drive-root copy guard, C.UTF-8 locale). Bannerlator/WinNative/Winlator-bionic; needs a fresh arm64ec container.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          
          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "11.0-2.1-${ARCH_NAME}",
            "versionCode": 16,
            "description": "EXPERIMENTAL Wayland layer — Proton 11.0-2 ${ARCH_NAME} (bionic) with winewayland.drv + own Wayland Turnips. 8 Wayland Turnip drivers + app-selectable game driver: plain = upstream 7cda7850, a7xx = Vauzi-17 710/720/722 v3.6 recipe, a8xx = WN-Turnip 1.15 Balanced, a8xx-perf = WN-Turnip 1.15 Performance (PWR_MAX), a8xx-gen8 = Banners-Turnip A8xx gen8 recipe, a8xx-smxz = StevenMXZ Turnip Gen8 V36 recipe, a8xx-white = whitebelyash Mainline Turnip v31, a8xx-upstream = Mesa main @ bbc7792f (2026-09-13). Native OpenGL now renders on Wayland (EGL takes Mesa's Wayland DRM path: zink + kopper on the same Turnip, not the software backend that drew nothing). All eight follow the compositor's LIVE zero-copy switch (banner_ahb_v1 version 2), falling back to the versionCode 5 behaviour on an app that only advertises version 1. Keyboard layout names via bundled xkeyboard-config; desktop-close grace restored to 1 s. XP Start menu Control Panel opens Wine's Control Panel (control.exe, with its icon; Add/Remove Programs, Game Controllers, Internet Settings) and explorer opens ::{CLSID} shell folders again. OpenGL also renders on phones with no DRM render node (EGL: zink + kopper without one, not the black software path). HDR10 screens are described to Windows: given the app's BANNER_WAYLAND_HDR_MAX_NITS / _MAX_AVG_NITS / _MIN_NITS, the Wayland monitor and the Windows virtual desktop's monitor (the one DXGI reads) carry an EDID with CTA-861.3 HDR static metadata (SMPTE ST 2084, BT.2020), so DXGI reports the screen's real peak, frame-average and black level instead of DXVK's 1499/799/0.01-nit stand-ins. With HDR on for the session (DXVK_HDR=1) that monitor, and the virtual desktop's, also report Windows advanced colour (DisplayConfig GET_ADVANCED_COLOR_INFO), so games stop greying out their own HDR option; only a real HDR10 EDID can claim it, and X11 sessions are unchanged. The layer also ships Wine's own amd_ags_x64.dll for the first time (it was disabled in the arm64ec build), so a game that links AMD's AGS - RE Engine titles do, and gate their HDR option on it - stops using the copy beside its .exe and gets the screen's real HDR state from DXGI. DisplayConfig answers GET_SDR_WHITE_LEVEL and SET_ADVANCED_COLOR_STATE too; what AGS decided is recorded in the prefix registry, under HKEY_CURRENT_USER > Software > Wine > AmdAgs, together with every step it took (DLL attach, entry point, Vulkan result, displays found), so a greyed-out HDR option is traceable with no Wine log. The builtin AGS now wins over the amd_ags_x64.dll a game ships beside its .exe (that copy needs an AMD driver and reports no display here); only that module is redirected and the default load order is unchanged. Zero-copy game buffers are UBWC-compressed where gralloc and the compositor can take them (gralloc vendor usage bit 28, kept only when the handle proves it; linear otherwise). Base: — stock Valve + fast-yield gate + FEX-unixlib loader + DirectAudio v1.3.2 (opt-in: registry Audio=directaudio; pulse/alsa stay default). Bannerlator/WinNative/Winlator-bionic; needs a fresh arm64ec container.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
      
      - name: Package build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
            ARCH_NAME="x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
            ARCH_NAME="arm64ec"
          fi
          
          cd $OUTPUT_DIR

          # The Wayland driver on its own, laid out like the installed Proton directory.
          for f in lib/wine/aarch64-unix/winewayland.so lib/wine/aarch64-windows/winewayland.drv \
                   lib/wine/i386-windows/winewayland.drv; do
            if [ -f "$f" ]; then mkdir -p "$GITHUB_WORKSPACE/winewayland-files/$(dirname "$f")"; cp "$f" "$GITHUB_WORKSPACE/winewayland-files/$f"; fi
          done
          
          # Create Proton WCP - zstd (tar.zst) for fast in-app install. The app's ContentsManager
          # tries XZ then falls back to ZSTD, so a zstd .wcp installs with no app change and decompresses
          # far faster than xz. -T0 = all cores, -19 = high ratio (small download).
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf proton-11.0-2-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv proton-11.0-2-$ARCH_NAME.wcp $GITHUB_WORKSPACE/
          
          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf proton-wine-11.0-2-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv proton-wine-11.0-2-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/
      
      - name: Upload build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV
      
      - name: Upload Proton build artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: proton-11.0-2-${{ env.ARCH_NAME }}.wcp
          retention-days: 30
      
      # Just the Wayland driver, for replacing it in an installed copy of this same build.
      - name: Upload Wayland driver for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: winewayland-${{ env.ARCH_NAME }}
          path: winewayland-files
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wine build artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: proton-wine-${{ env.ARCH_NAME }}-sdk${{ matrix.api_level }}
          path: proton-wine-11.0-2-${{ env.ARCH_NAME }}.wcp.xz
          retention-days: 30
  
  release:
    needs: build
    runs-on: ubuntu-24.04
    # Disabled: releases are cut only via publish-p11-consolidated.yml. A push
    # no longer auto-publishes a per-sdk release. Artifacts are still uploaded.
    if: false
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.wcp" -exec cp {} release/ \;
          find artifacts -name "*.wcp.xz" -exec cp {} release/ \;
          ls -lah release/
      
      - name: Generate date-based tag
        id: generate_tag
        run: |
          DATE=$(date +%Y%m%d)
          TAG_NAME="build-p11-${DATE}-sdk28"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Proton Wine 11.0-2 (SDK 28, ${{ steps.generate_tag.outputs.tag_name }})
          files: release/*
          draft: false
          prerelease: false
          body: |
            # Caution: This version is provided for testing purposes only. It may lead to game instability or crashes. Use at your own risk.
            
            ## Proton Wine Build based on Valve [Wine](https://github.com/ValveSoftware/wine/tree/proton_11.0)
            
            ### Proton Version: 11.0-2
            
            Built from commit: ${{ github.sha }}
            
            ### Architectures
            - x86_64 (Intel/AMD 64-bit)
            - arm64ec (ARM64EC)
            
            ### WCP Files
            **Proton Type:**
            - `proton-11.0-2-x86_64.wcp` - For GameNative
            - `proton-11.0-2-arm64ec.wcp` - For GameNative
            
            **Wine Type:**
            - `proton-wine-11.0-2-x86_64.wcp.xz` - For Winlator for CMOD & Ludashi
            - `proton-wine-11.0-2-arm64ec.wcp.xz` - For Winlator for CMOD & Ludashi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
